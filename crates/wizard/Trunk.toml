# Build: trunk build --release   (dev: trunk watch, while `cargo run -p server` serves it)
# The server serves dist/ at /deploy and the shared CSS and images at /assets.
[build]
target = "index.html"
dist = "dist"
public_url = "/deploy/"

# Pinned so trunk uses the binaries the Dockerfile installs; keep wasm_bindgen in step with
# wasm-bindgen in Cargo.lock.
[tools]
wasm_bindgen = "0.2.130"
wasm_opt = "version_131"
