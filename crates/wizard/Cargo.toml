[package]
name = "wizard"
version = "0.1.0"
edition = "2021"
description = "The /deploy wizard of artcraftcloud.com (Leptos, client-side Wasm)"
license = "MIT OR Apache-2.0"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
site = { path = "../site" }
types = { path = "../types" }
wasm-bindgen = "0.2"
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
serde_json = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = ["Window", "Navigator", "Clipboard", "RequestMode"]

[dependencies.wasm-bindgen-futures]
version = "0.4"
