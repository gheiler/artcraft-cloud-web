[package]
name = "server"
version = "0.1.0"
edition = "2021"
description = "artcraftcloud.com: server-rendered pages, the deploy API and provider clients"
license = "MIT OR Apache-2.0"

[[bin]]
name = "artcraft-cloud-web"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
types = { path = "../types" }
site = { path = "../site", features = ["ssr"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "compression-gzip", "trace"] }
getrandom = "0.3"
tower = { version = "0.5", features = ["util"] }
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio"] }

[dev-dependencies]
http-body-util = "0.1"
