#cloud-config
# artcraftCloud on a fresh VPS (Ubuntu 24.04 or Debian 12, x86_64).
#
# Paste this file into your host's "cloud-init" / "user data" / "recipe" box when you create the
# server. Only the four values under /opt/artcraft/.env need editing, and all of them may stay empty:
#
#   ARTCRAFT_DOMAIN          cloud.example.eu, pointed at the server's IP with an A record.
#                            Empty: https://<ip-with-dashes>.sslip.io, so you can try it without a domain.
#   ARTCRAFT_ACME_EMAIL      Let's Encrypt contact for certificate expiry mail (optional).
#   ARTCRAFT_ADMIN_PASSWORD  Empty: one is generated and saved to /root/artcraft-admin-password.txt.
#   ARTCRAFT_MAIL            1 also starts the Stalwart mail server (read docs/mail.md first).
#
# What it does: installs Docker, opens ports 22/80/443 (+25/465/993 for mail) in ufw, and starts
# artcraftCloud behind Caddy, which gets the HTTPS certificate on its own (the apps need https).
# Progress: `tail -f /var/log/artcraft-install.log`. The stack lives in /opt/artcraft; re-run
# `bash /opt/artcraft/install.sh` after editing .env. The artcraftcloud.com deploy wizard fills in
# the same values for you; this file is the one recipe both share.

package_update: true
packages:
  - ca-certificates
  - curl
  - openssl
  - ufw

write_files:
  - path: /opt/artcraft/.env
    permissions: "0600"
    content: |
      ARTCRAFT_DOMAIN=
      ARTCRAFT_ACME_EMAIL=
      ARTCRAFT_ADMIN_PASSWORD=
      ARTCRAFT_MAIL=0
      ARTCRAFT_IMAGE=ghcr.io/gheiler/artcraft-cloud:latest

  - path: /opt/artcraft/compose.yaml
    permissions: "0644"
    content: |
      # Generated by artcraftCloud's cloud-init recipe. Values come from .env next to this file.
      services:
        artcraft-cloud:
          image: ${ARTCRAFT_IMAGE:-ghcr.io/gheiler/artcraft-cloud:latest}
          container_name: artcraft-cloud
          restart: unless-stopped
          # Only Caddy talks to it; nothing listens on a public port but 80/443.
          expose: ["8080"]
          environment:
            ARTCRAFT_PUBLIC_URL: https://${ARTCRAFT_DOMAIN}
            ARTCRAFT_ADMIN_USER: admin
            ARTCRAFT_ADMIN_PASSWORD: ${ARTCRAFT_ADMIN_PASSWORD:-}
            ARTCRAFT_COOKIE_SECURE: "1"
            ARTCRAFT_MAIL_URL: http://stalwart:8080
            ARTCRAFT_APP_CACHE: /cache
          volumes:
            - /opt/artcraft/data:/data
            - artcraft-app-cache:/cache
          mem_limit: 128m
          read_only: true
          tmpfs: [/tmp]
          security_opt: ["no-new-privileges:true"]
          cap_drop: [ALL]

        caddy:
          image: docker.io/library/caddy:2
          container_name: artcraft-caddy
          restart: unless-stopped
          ports: ["80:80", "443:443", "443:443/udp"]
          volumes:
            - /opt/artcraft/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config
          mem_limit: 64m

        # Optional mail (AGPL-3.0, its own container). Started only when ARTCRAFT_MAIL=1.
        stalwart:
          profiles: ["mail"]
          image: docker.io/stalwartlabs/stalwart:v1.2.0
          container_name: artcraft-mail
          restart: unless-stopped
          ports:
            - "25:25"
            - "465:465"
            - "993:993"
            - "127.0.0.1:8081:8080"
          volumes:
            - stalwart-config:/etc/stalwart
            - stalwart-data:/var/lib/stalwart
          mem_limit: 256m

      volumes:
        artcraft-app-cache:
          name: artcraft-app-cache
        caddy-data:
        caddy-config:
        stalwart-config:
        stalwart-data:

  - path: /opt/artcraft/install.sh
    permissions: "0700"
    content: |
      #!/usr/bin/env bash
      # Idempotent: safe to run again after editing /opt/artcraft/.env.
      set -euo pipefail
      # The overrides exist for deploy/cloud-init/check.sh, which runs this script with stubs.
      root=${ARTCRAFT_ROOT:-/opt/artcraft}
      secret_file=${ARTCRAFT_SECRET_FILE:-/root/artcraft-admin-password.txt}
      cd "$root"
      exec > >(tee -a "${ARTCRAFT_LOG:-/var/log/artcraft-install.log}") 2>&1
      echo "== artcraftCloud install $(date -Is)"

      setenv() { # setenv KEY VALUE: rewrite one line of .env
        local tmp; tmp=$(mktemp); grep -v "^$1=" .env > "$tmp" || true
        printf '%s=%s\n' "$1" "$2" >> "$tmp"; cat "$tmp" > .env; rm -f "$tmp"
      }
      set -a
      # shellcheck source=/dev/null
      . ./.env
      set +a

      if [ -z "${ARTCRAFT_DOMAIN:-}" ]; then
        # The address the default route leaves from. On hosts that put the server behind NAT,
        # set ARTCRAFT_DOMAIN instead.
        ip=$(ip -4 route get 1.1.1.1 | awk '{for (i = 1; i < NF; i++) if ($i == "src") print $(i + 1)}')
        ARTCRAFT_DOMAIN="${ip//./-}.sslip.io"
        setenv ARTCRAFT_DOMAIN "$ARTCRAFT_DOMAIN"
        echo "No domain set, using $ARTCRAFT_DOMAIN"
      fi

      if [ -z "${ARTCRAFT_ADMIN_PASSWORD:-}" ]; then
        ARTCRAFT_ADMIN_PASSWORD=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
        setenv ARTCRAFT_ADMIN_PASSWORD "$ARTCRAFT_ADMIN_PASSWORD"
      fi
      umask 077
      printf 'https://%s\nuser: admin\npassword: %s\n' "$ARTCRAFT_DOMAIN" "$ARTCRAFT_ADMIN_PASSWORD" \
        > "$secret_file"

      if ! command -v docker > /dev/null || ! docker compose version > /dev/null 2>&1; then
        curl -fsSL https://get.docker.com | sh
      fi
      systemctl enable --now docker

      mkdir -p "$root/data"
      # The image runs as an unprivileged user; let it own its data folder.
      chown -R 10001 "$root/data"

      # Caddy gets the certificate for the domain on its own.
      {
        if [ -n "${ARTCRAFT_ACME_EMAIL:-}" ]; then printf '{\n  email %s\n}\n' "$ARTCRAFT_ACME_EMAIL"; fi
        printf '%s {\n  encode zstd gzip\n  reverse_proxy artcraft-cloud:8080\n}\n' "$ARTCRAFT_DOMAIN"
      } > Caddyfile
      chmod 644 Caddyfile

      ufw allow 22/tcp
      ufw allow 80/tcp
      ufw allow 443
      profile=()
      if [ "${ARTCRAFT_MAIL:-0}" = "1" ]; then
        ufw allow 25/tcp; ufw allow 465/tcp; ufw allow 993/tcp
        profile=(--profile mail)
      fi
      ufw --force enable

      docker compose "${profile[@]}" pull
      docker compose "${profile[@]}" up -d --remove-orphans

      echo "Waiting for https://$ARTCRAFT_DOMAIN/healthz ..."
      for _ in $(seq 1 "${ARTCRAFT_WAIT_TRIES:-60}"); do
        if curl -fsS -o /dev/null "https://$ARTCRAFT_DOMAIN/healthz"; then
          echo "artcraftCloud is up: https://$ARTCRAFT_DOMAIN (login in $secret_file)"
          exit 0
        fi
        sleep "${ARTCRAFT_WAIT_SECONDS:-10}"
      done
      echo "Started, but https://$ARTCRAFT_DOMAIN/healthz is not answering yet."
      echo "Check DNS for $ARTCRAFT_DOMAIN and: docker compose -f $root/compose.yaml logs"

runcmd:
  - [bash, /opt/artcraft/install.sh]

final_message: "artcraftCloud cloud-init done after $UPTIME s. Details: /var/log/artcraft-install.log"
